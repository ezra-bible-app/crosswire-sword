apply plugin: 'com.android.application'

android {
    compileSdk 33

    defaultConfig {
        applicationId "org.crosswire.android.sword"
        minSdk 24
        targetSdk 33
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        externalNativeBuild {
            cmake {
                cppFlags ""
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
        debug {
            jniDebuggable = true
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }
    flavorDimensions 'Fast'
    ndkVersion '29.0.14206865'
    namespace 'org.crosswire.android.sword'
    buildFeatures.prefab = true
}


dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    // OpenSSL and curl are our own prefab builds (16 KB page-aligned, NDK 29);
    // see ../../prefab-repo and the ndkports notes in ../../README
    implementation 'org.crosswire.ndkports:openssl:3.5.8'
    implementation 'org.crosswire.ndkports:curl:8.22.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    testImplementation 'junit:junit:4.13'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

android {
    defaultConfig {
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_shared"
            }}}}